- name: Tell me it needs to be installed
  ansible.builtin.debug:
    msg: "Log Insight needs to be installed on {{ inventory_hostname }}"
  when: need_install

- name: Tell me it is installed alredy
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} already has Log Insight installed"
  when: not need_install
