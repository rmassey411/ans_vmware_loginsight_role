---
- name: Check for install on RedHat
  block:
    - name: Search for rpm
      ansible.builtin.shell:
        cmd: rpm -qa | grep "VMware-Log-Insight-Agent" | wc -l
      register: rpm_output

    - name: Disply command output
      ansible.builtin.debug:
        msg: "{{ rpm_output.stdout }}"

    - name: Set fact for install_state to false
      ansible.builtin.set_fact:
        need_install: true
      when: rpm_output.stdout |int == 0

    - name: Set fact for install_state to true
      ansible.builtin.set_fact:
        need_install: false
      when: rpm_output.stdout |int == 1
  when: ansible_distribution == "RedHat"

